<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="16 8"/>
  <!-- Middle Ring with Segment Marks -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <!-- 8 Radial Segment Blades -->
  <g stroke="#38bdf8" stroke-width="3" stroke-opacity="0.75" filter="url(#glow)">
    <line x1="256" y1="66" x2="256" y2="106"/>
    <line x1="256" y1="406" x2="256" y2="446"/>
    <line x1="66" y1="256" x2="106" y2="256"/>
    <line x1="406" y1="256" x2="446" y2="256"/>
    <line x1="122" y1="122" x2="150" y2="150"/>
    <line x1="362" y1="362" x2="390" y2="390"/>
    <line x1="362" y1="122" x2="390" y2="150"/>
    <line x1="122" y1="362" x2="150" y2="390"/>
  </g>
  <!-- Inner Rotating Cage -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#0284c7" stroke-width="6" stroke-opacity="0.5" stroke-dasharray="32 16"/>
  <!-- Central Arc Reactor Core -->
  <circle cx="256" cy="256" r="85" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="50" fill="#f0f9ff" filter="url(#glow)"/>
  <polygon points="256,220 287,274 225,274" fill="none" stroke="#0284c7" stroke-width="4"/>
</svg>
