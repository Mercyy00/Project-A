<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Initializing</title>
  <style>
    :root {
      --bg: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.25);
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #111a28 0%, #080a0e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Window Drag Header */
    .drag-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.85;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 1.5s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    /* Central Content */
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
    }

    .ring-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .outer-spinner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: rgba(0, 210, 255, 0.3);
      animation: spin 1.4s linear infinite;
    }

    .inner-spinner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #7928ca;
      border-left-color: rgba(121, 40, 202, 0.3);
      animation: spin-reverse 2s linear infinite;
    }

    .center-core {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(0, 0, 0, 0.5) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .center-core svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #8bb2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .status-box {
      width: 100%;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: #94a3b8;
    }

    .status-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .action-btn {
      margin-top: 18px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: #0066cc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: background 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .action-btn:hover {
      background: #0077ee;
    }
  </style>
</head>
<body>
  <div class="drag-header">
    <div class="brand-pill">
      <div class="brand-dot"></div>
      <span>J.A.R.V.I.S. Core</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">
        <svg width="10" height="1" viewBox="0 0 10 1"><path fill="currentColor" d="M0 0h10v1H0z"/></svg>
      </button>
      <button class="win-btn close" id="btn-close" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M1 0L0 1l4 4-4 4 1 1 4-4 4 4 1-1-4-4 4-4-1-1-4 4z"/></svg>
      </button>
    </div>
  </div>

  <div class="splash-card">
    <div class="ring-container">
      <div class="outer-spinner"></div>
      <div class="inner-spinner"></div>
      <div class="center-core">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.93 4.93l2.12 2.12m9.9 9.9l2.12 2.12M4.93 19.07l2.12-2.12m9.9-9.9l2.12-2.12"/>
        </svg>
      </div>
    </div>

    <h1>Project JARVIS</h1>
    <div class="subtitle">Autonomous AI Desktop Operating Environment</div>

    <div class="status-box">
      <div class="brand-dot"></div>
      <div class="status-text" id="status-msg">Connecting to Python Core (127.0.0.1:8000)...</div>
    </div>

    <button class="action-btn" id="retry-btn">Retry Connection</button>
  </div>

  <script>
    if (window.electronAPI) {
      document.getElementById('btn-minimize').addEventListener('click', () => {
        window.electronAPI.minimizeWindow();
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        window.electronAPI.closeWindow();
      });
    }

    const retryBtn = document.getElementById('retry-btn');
    const statusMsg = document.getElementById('status-msg');

    retryBtn.addEventListener('click', () => {
      retryBtn.style.display = 'none';
      statusMsg.textContent = 'Retrying connection to backend...';
      if (window.electronAPI && window.electronAPI.retryBackend) {
        window.electronAPI.retryBackend();
      } else {
        location.reload();
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'STATUS_UPDATE') {
        statusMsg.textContent = event.data.message;
        if (event.data.failed) {
          retryBtn.style.display = 'inline-block';
        }
      }
    });
  </script>
</body>
</html>
